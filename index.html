<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Registre des expéditions – SOKA</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --navy: #16233D;
  --blue: #2C5F8A;
  --blue-soft: #4A6E8A;
  --ochre: #B98D4F;
  --khaki: #6B7F4F;
  --khaki-dark: #5A6E42;
  --taupe: #8A7F63;
  --paper: #F1ECDF;
  --cream: #F7F4EB;
  --bg: #EFE9DC;
  --line: #DCD5C2;
  --ink: #1F2A24;
  --muted: #6B6250;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  font-family: 'IBM Plex Sans', Arial, sans-serif;
  color: var(--ink);
}
.display { font-family: 'Oswald', Arial, sans-serif; }
.mono { font-family: 'IBM Plex Mono', 'Consolas', monospace; }

header {
  background: var(--navy);
  padding: 22px 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
}
header h1 { font-size: 22px; color: var(--paper); letter-spacing: 0.04em; text-transform: uppercase; margin: 0; }
header .subtitle { font-size: 12px; color: #8FA0BE; margin-top: 2px; }

.sync-badge {
  font-size: 11px; padding: 3px 9px; border-radius: 12px; font-family: 'IBM Plex Sans', Arial, sans-serif;
  display: inline-block; margin-top: 6px; letter-spacing: 0.02em;
}
.sync-connecting { background: rgba(143,160,190,0.2); color: #B7C2D6; }
.sync-synced { background: rgba(107,127,79,0.25); color: #C3D4A8; }
.sync-offline { background: rgba(185,141,79,0.25); color: #E3C088; }
.sync-error { background: rgba(176,58,46,0.3); color: #EFAFA5; }

.header-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.btn {
  display: flex; align-items: center; gap: 6px; border: none; border-radius: 3px;
  padding: 9px 14px; font-family: 'Oswald', Arial, sans-serif; font-size: 12.5px;
  letter-spacing: 0.05em; text-transform: uppercase; font-weight: 600; cursor: pointer;
  transition: transform 0.12s ease, opacity 0.12s ease, background 0.12s ease;
}
.btn:hover { transform: translateY(-1px); opacity: 0.92; }
.btn:active { transform: translateY(0); }
.btn-primary { background: var(--ochre); color: var(--navy); }
.btn-outline { background: transparent; color: var(--paper); border: 1px solid var(--blue-soft); }
.btn-ghost { background: transparent; color: var(--paper); border: 1px solid rgba(241,236,223,0.35); }

.toolbar { display: flex; gap: 8px; padding: 16px 24px 0; flex-wrap: wrap; align-items: center; }
.chip {
  padding: 5px 12px; border-radius: 20px; border: 1px solid var(--line); background: transparent;
  color: var(--muted); font-size: 11.5px; font-family: 'Oswald', Arial, sans-serif;
  letter-spacing: 0.04em; text-transform: uppercase; cursor: pointer;
  transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
}
.chip.active { border-color: var(--ink); background: var(--ink); color: var(--paper); }
.chip.client-active { border-color: var(--blue); background: var(--blue); color: var(--paper); display:flex; align-items:center; gap:5px; }

main { padding: 24px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
.empty {
  text-align: center; padding: 60px 20px; color: var(--taupe); font-family: 'Oswald', Arial, sans-serif;
  font-size: 14px; letter-spacing: 0.04em; text-transform: uppercase;
}
.empty .sub { font-family: 'IBM Plex Sans', Arial, sans-serif; text-transform: none; letter-spacing: normal; font-size: 12.5px; margin-top: 6px; }

.card { background: var(--paper); border: 1px solid var(--line); border-radius: 3px; padding: 18px 18px 14px; transition: box-shadow 0.2s ease, transform 0.2s ease; }
.card:hover { box-shadow: 0 4px 14px rgba(22,35,61,0.10); transform: translateY(-2px); }
.ref { font-family: 'IBM Plex Mono', monospace; font-size: 20px; font-weight: 600; margin-bottom: 4px; }
.client-link {
  background: none; border: none; padding: 0; cursor: pointer; font-family: 'Oswald', Arial, sans-serif;
  font-size: 14.5px; color: #8A6A3B; text-decoration: underline dotted; text-underline-offset: 3px;
  margin-bottom: 4px; display: block;
}
.meta { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); margin-bottom: 14px; flex-wrap: wrap; }

.boat-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
.status-label { font-family: 'Oswald', Arial, sans-serif; font-size: 17px; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase; }
.phase-text { font-size: 11.5px; color: var(--muted); }
.lane { position: relative; height: 46px; border-radius: 6px; background: linear-gradient(180deg,#DEE6EC 0%,#C2D3DE 100%); overflow: hidden; margin-bottom: 14px; }
.lane .dash { position: absolute; left: 0; right: 0; top: 58%; border-top: 2px dashed rgba(31,42,36,0.25); }
.lane .port { position: absolute; top: 50%; transform: translateY(-50%); color: var(--blue-soft); font-size: 15px; }
.lane .boat { position: absolute; top: 50%; transform: translate(-50%, -50%); transition: left 0.5s cubic-bezier(0.22, 1, 0.36, 1); font-size: 22px; }

.stepper { margin-bottom: 10px; }
.stepper-label { display: flex; align-items: center; gap: 6px; font-family: 'Oswald', Arial, sans-serif; font-size: 11px; letter-spacing: 0.08em; color: var(--muted); text-transform: uppercase; margin-bottom: 6px; }
.steps-row { display: flex; align-items: center; }
.step-dot { width: 16px; height: 16px; border-radius: 50%; flex-shrink: 0; border: 2px solid var(--line); background: var(--paper); cursor: pointer; padding: 0; transition: transform .15s, background .15s; }
.step-dot.current { transform: scale(1.25); }
.step-connector { flex: 1; height: 2px; background: var(--line); }
.stepper-current { font-size: 11.5px; color: #3A362C; margin-top: 5px; }

.card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--line); }
.moovapps-link { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--ink); text-decoration: none; }
.no-link { font-size: 12px; color: #B3AC98; }
.delete-btn { background: none; border: none; cursor: pointer; color: #B3AC98; padding: 4px; font-size: 14px; }

.modal-overlay {
  position: fixed; inset: 0; background: rgba(22,35,61,0.55); display: flex; align-items: center;
  justify-content: center; z-index: 50; padding: 16px;
  animation: overlay-in 0.15s ease;
}
.modal {
  background: var(--cream); border-radius: 4px; padding: 24px; width: 100%; max-width: 460px;
  border: 1px solid var(--line); max-height: 88vh; overflow-y: auto;
  animation: modal-in 0.18s cubic-bezier(0.22, 1, 0.36, 1);
}
@keyframes overlay-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes modal-in { from { opacity: 0; transform: translateY(8px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
.modal.wide { max-width: 640px; }
.modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.modal-head h2 { font-family: 'Oswald', Arial, sans-serif; font-size: 16px; text-transform: uppercase; letter-spacing: 0.06em; margin: 0; }
.close-btn { background: none; border: none; cursor: pointer; color: var(--muted); font-size: 18px; }
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.04em; }
.field input, .field textarea, .field select { width: 100%; padding: 8px 10px; border-radius: 3px; border: 1px solid var(--line); background: #fff; font-size: 13px; font-family: 'IBM Plex Sans', Arial, sans-serif; }
.field textarea { font-family: 'IBM Plex Mono', monospace; min-height: 110px; resize: vertical; }
.modal-note { font-size: 12.5px; color: var(--muted); margin-bottom: 12px; line-height: 1.5; }
.modal-submit { width: 100%; margin-top: 6px; padding: 10px 0; background: var(--ink); color: var(--paper); border: none; border-radius: 3px; font-family: 'Oswald', Arial, sans-serif; font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; cursor: pointer; }
.warning-box { margin-top: 10px; padding: 10px; background: #F3E8D9; border: 1px solid var(--line); border-radius: 3px; font-size: 11.5px; color: #7A5A2C; }
.import-result { margin-top: 10px; font-size: 12.5px; color: var(--khaki-dark); }

.storage-note { margin: 0 24px; font-size: 11.5px; color: var(--muted); background: #fff; border: 1px solid var(--line); border-radius: 3px; padding: 8px 12px; }

.settings-columns { display: flex; gap: 20px; flex-wrap: wrap; }
.settings-col { flex: 1; min-width: 220px; }
.settings-col h3 { font-family: 'Oswald', Arial, sans-serif; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin: 0 0 8px; }
.step-edit-row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; flex-wrap: wrap; }
.step-edit-row input { flex: 1; min-width: 100px; padding: 6px 8px; border-radius: 3px; border: 1px solid var(--line); font-size: 12.5px; }
.step-num {
  font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--muted); min-width: 16px; text-align: right;
}
.icon-btn { background: none; border: 1px solid var(--line); border-radius: 3px; cursor: pointer; font-size: 12px; padding: 4px 6px; color: var(--muted); }
.add-step-btn { margin-top: 4px; background: none; border: 1px dashed var(--line); border-radius: 3px; padding: 6px 10px; font-size: 12px; color: var(--muted); cursor: pointer; width: 100%; }

.doc-section { margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--line); }
.check-chip-list { display: flex; flex-wrap: wrap; gap: 6px; }
.check-chip {
  display: flex; align-items: center; gap: 5px; font-size: 12px; padding: 5px 10px; border-radius: 14px;
  border: 1px solid var(--line); background: #fff; color: var(--muted); cursor: pointer;
  font-family: 'IBM Plex Sans', Arial, sans-serif; transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
}
.check-chip .check-box { display: inline-flex; width: 13px; height: 13px; align-items: center; justify-content: center; }
.check-chip.checked { background: var(--blue); border-color: var(--blue); color: var(--paper); }
.doc-btn {
  font-size: 10.5px; padding: 3px 9px; border-radius: 3px; border: 1px solid var(--line); background: transparent;
  color: var(--muted); cursor: pointer; font-family: 'Oswald', Arial, sans-serif; letter-spacing: 0.03em;
  text-transform: uppercase; transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
}
.doc-btn.active-soka { background: var(--ochre); border-color: var(--ochre); color: var(--navy); }
.doc-btn.active-transit { background: #8A6A3B; border-color: #8A6A3B; color: var(--paper); }

.comment-section { margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--line); }
.comment-section textarea {
  width: 100%; min-height: 52px; padding: 7px 9px; border-radius: 3px; border: 1px solid var(--line);
  background: #fff; font-size: 12.5px; font-family: 'IBM Plex Sans', Arial, sans-serif; resize: vertical;
}

/* Frise chronologique */
.timeline-wrap { padding: 14px 24px 0; }
.timeline-track { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 8px; }
.timeline-empty { font-size: 12px; color: var(--taupe); padding: 4px 0 0; }
.timeline-chip {
  flex-shrink: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
  background: #fff; border: 1px solid var(--line); border-left: 4px solid var(--taupe);
  border-radius: 4px; padding: 8px 12px; cursor: pointer; min-width: 120px; text-align: left;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}
.timeline-chip:hover { transform: translateY(-2px); box-shadow: 0 3px 10px rgba(22,35,61,0.12); }
.timeline-chip.cat-positionnement { border-left-color: var(--taupe); }
.timeline-chip.cat-chargement { border-left-color: var(--ochre); }
.timeline-chip.cat-etd { border-left-color: var(--blue); }
.timeline-chip.cat-termine { border-left-color: var(--khaki); }
.timeline-date { font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600; color: var(--ink); }
.timeline-ref { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: var(--muted); }
.timeline-client { font-family: 'Oswald', Arial, sans-serif; font-size: 12px; color: var(--ink); }
.timeline-milestone { font-size: 10px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }

/* Badge de catégorie sur chaque fiche */
.milestone-badge {
  display: inline-block; font-size: 10.5px; padding: 3px 9px; border-radius: 12px;
  font-family: 'Oswald', Arial, sans-serif; letter-spacing: 0.03em; text-transform: uppercase;
  margin-bottom: 8px; color: #fff;
}
.milestone-badge.milestone-positionnement { background: var(--taupe); }
.milestone-badge.milestone-chargement { background: var(--ochre); color: var(--navy); }
.milestone-badge.milestone-etd { background: var(--blue); }
.milestone-badge.milestone-termine { background: var(--khaki); }

/* Section Dates sur chaque fiche */
.dates-section { margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--line); }
.dates-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.date-field label { display: block; font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 2px; }
.date-field input {
  width: 100%; padding: 5px 6px; border-radius: 3px; border: 1px solid var(--line); font-size: 12px;
  font-family: 'IBM Plex Sans', Arial, sans-serif; box-sizing: border-box;
}

/* Surbrillance temporaire après clic depuis la frise */
.card-highlight { animation: card-pulse 1.5s ease; }
@keyframes card-pulse {
  0% { box-shadow: 0 0 0 3px rgba(44,95,138,0.55); }
  100% { box-shadow: 0 1px 0 rgba(0,0,0,0.04); }
}

/* Carte des expéditions */
.map-svg { width: 100%; height: auto; border-radius: 4px; border: 1px solid var(--line); }
.map-sea { fill: #DEE6EC; }
.map-grid { stroke: rgba(31,42,36,0.08); stroke-width: 1; }
.map-equator { stroke: rgba(31,42,36,0.18); stroke-width: 1; stroke-dasharray: 4 3; }
.map-continent { fill: #C7D6CC; stroke: #AEC0B4; stroke-width: 1; }
.map-pin { cursor: pointer; }
.map-pin-dot { fill: var(--blue); stroke: #fff; stroke-width: 1.5; transition: r 0.15s ease; }
.map-pin:hover .map-pin-dot { r: 9; fill: var(--ochre); }
.map-pin-count { font-family: 'Oswald', Arial, sans-serif; font-size: 8px; fill: #fff; pointer-events: none; }
.map-legend { display: flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--muted); margin-top: 8px; }

.unlocated-list { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
.unlocated-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.unlocated-name { font-size: 12.5px; color: var(--ink); min-width: 120px; flex: 1; }
.unlocated-row input { width: 90px; padding: 5px 7px; border-radius: 3px; border: 1px solid var(--line); font-size: 12px; }

.port-popover { margin-top: 14px; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.port-popover-head {
  display: flex; justify-content: space-between; align-items: center; padding: 8px 12px;
  background: var(--navy); color: var(--paper); font-family: 'Oswald', Arial, sans-serif;
  font-size: 13px; text-transform: uppercase; letter-spacing: 0.03em;
}
.port-popover-head .close-btn { color: var(--paper); }
.port-popover-row {
  display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 12px; border: none;
  border-top: 1px solid var(--line); background: #fff; cursor: pointer; text-align: left;
  transition: background 0.12s ease;
}
.port-popover-row:hover { background: var(--paper); }
.port-popover-ref { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--ink); }
.port-popover-client { font-family: 'Oswald', Arial, sans-serif; font-size: 12px; color: var(--muted); margin-left: auto; }

/* Écran de code d'accès */
.gate-overlay {
  position: fixed; inset: 0; background: var(--navy); display: flex; align-items: center;
  justify-content: center; z-index: 100; padding: 20px;
}
.gate-box { max-width: 340px; width: 100%; text-align: center; }
.gate-title {
  font-family: 'Oswald', Arial, sans-serif; font-size: 20px; color: var(--paper); text-transform: uppercase;
  letter-spacing: 0.05em; margin-bottom: 10px;
}
.gate-text { font-size: 12.5px; color: #B7C2D6; line-height: 1.5; margin-bottom: 16px; }
.gate-error { font-size: 12px; color: #EFAFA5; margin-bottom: 10px; }
.gate-box input {
  width: 100%; padding: 10px 12px; border-radius: 3px; border: 1px solid var(--blue-soft); background: #fff;
  font-size: 14px; font-family: 'IBM Plex Mono', monospace; text-align: center; box-sizing: border-box;
}

@media (max-width: 480px) {
  header { padding: 16px; }
  main { padding: 16px; }
  .storage-note { margin: 0 16px; }
  .toolbar { padding: 12px 16px 0; }
}

</style>
</head>
<body>

<div id="access-gate-root"></div>

<header>
  <div>
    <h1>Registre des expéditions</h1>
    <div class="subtitle">Suivi client · Suivi transitaire · Accès Moovapps</div>
    <span id="sync-status" class="sync-badge sync-connecting">● Connexion…</span>
  </div>
  <div class="header-actions">
    <button class="btn btn-ghost" data-action="export-csv"><svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg> Exporter</button>
    <button class="btn btn-ghost" data-action="open-import"><svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg> Importer</button>
    <button class="btn btn-ghost" data-action="open-map"><svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg> Carte</button>
    <button class="btn btn-ghost" data-action="open-settings"><svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg> Réglages</button>
    <button class="btn btn-primary" data-action="open-new"><svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg> Nouvel envoi</button>
  </div>
</header>

<div class="timeline-wrap" id="timeline"></div>

<div class="storage-note">
  Les données restent dans ce navigateur (localStorage), sur cet appareil.
</div>

<div class="toolbar" id="toolbar"></div>

<main>
  <div id="content"></div>
</main>

<div id="modal-root"></div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script>
// ===== Registre des expéditions — SOKA =====
// Aucune dépendance externe. Toutes les données restent dans ce navigateur
// (localStorage) de cet appareil.
// Les interactions passent par des attributs data-action + une délégation
// d'évènements unique (plus robuste que des onclick="" avec du texte
// utilisateur inséré dedans, qui cassaient dès qu'un nom contenait
// une apostrophe ou un guillemet).

const DEFAULT_STEPS = [
  { label: "Commande reçue", type: "client" },
  { label: "Documents transmis", type: "client" },
  { label: "Pris en charge", type: "transitaire" },

// ---------- Écran de code d'accès (chaque appareil le saisit une fois) ----------
function isPermissionError(err) {
  return !!err && (err.code === "permission-denied" || err.code === "PERMISSION_DENIED");
}

function showAccessGate(errorMessage) {
  document.getElementById("access-gate-root").innerHTML = `
  <div class="gate-overlay">
    <div class="gate-box">
      <div class="gate-title">Accès protégé</div>
      <div class="gate-text">Saisis le code d'accès pour ouvrir le registre des expéditions SOKA. Il ne sera demandé qu'une fois sur cet appareil.</div>
      ${errorMessage ? `<div class="gate-error">${escapeHtml(errorMessage)}</div>` : ""}
      <input id="access-code-input" type="text" placeholder="Code d'accès" autocomplete="off"
        onkeydown="if(event.key==='Enter'){document.getElementById('access-code-submit').click();}" />
      <button id="access-code-submit" class="modal-submit" style="background:var(--blue); color:var(--paper); margin-top:10px;" data-action="submit-access-code">Valider</button>
    </div>
  </div>`;
  const input = document.getElementById("access-code-input");
  if (input) input.focus();
}

function hideAccessGate() {
  document.getElementById("access-gate-root").innerHTML = "";
}

function submitAccessCode() {
  const input = document.getElementById("access-code-input");
  const code = (input.value || "").trim();
  if (!code) return;
  localStorage.setItem(ACCESS_CODE_KEY, code);
  hideAccessGate();
  initWithCode(code);
}

function handleWrongCode() {
  localStorage.removeItem(ACCESS_CODE_KEY);
  DOC_REF = null;
  setSyncStatus("error");
  showAccessGate("Code incorrect — réessaie.");
}

function initWithCode(code) {
  DOC_REF = db.collection("suivi-expeditions").doc(code);
  loadFromLocalCache();
  render();
  subscribeToCloud();
}

// ---------- Persistance : Firestore (source de vérité, synchronisée en
// temps réel entre appareils) + cache localStorage (secours hors-ligne
// et affichage instantané avant que Firestore ait répondu). ----------
function loadFromLocalCache() {
  try {
    const rawShipments = localStorage.getItem(SHIPMENTS_KEY);
    state.shipments = rawShipments ? JSON.parse(rawShipments) : [];
  } catch (e) { state.shipments = []; }

  try {
    const rawSteps = localStorage.getItem(STEPS_KEY);
    if (rawSteps) {
      const parsed = JSON.parse(rawSteps);
      if (Array.isArray(parsed) && parsed.length) state.steps = parsed;
    }
  } catch (e) { /* garde les valeurs par défaut */ }

  try {
    const rawDocuments = localStorage.getItem(DOCUMENTS_KEY);
    if (rawDocuments) {
      const parsed = JSON.parse(rawDocuments);
      if (Array.isArray(parsed)) state.documents = parsed;
    }
  } catch (e) { /* garde les valeurs par défaut */ }

  try {
    const rawLists = localStorage.getItem(LISTS_KEY);
    if (rawLists) {
      const parsed = JSON.parse(rawLists);
      if (Array.isArray(parsed.clients)) state.lists.clients = parsed.clients;
      if (Array.isArray(parsed.transitaires)) state.lists.transitaires = parsed.transitaires;
      if (Array.isArray(parsed.ports)) state.lists.ports = parsed.ports;
    }
  } catch (e) { /* garde les valeurs par défaut */ }

  try {
    const rawClientDocs = localStorage.getItem(CLIENT_DOCS_KEY);
    if (rawClientDocs) {
      const parsed = JSON.parse(rawClientDocs);
      if (parsed && typeof parsed === "object") state.clientDocuments = parsed;
    }
  } catch (e) { /* garde les valeurs par défaut */ }

  try {
    const rawClientPorts = localStorage.getItem(CLIENT_PORTS_KEY);
    if (rawClientPorts) {
      const parsed = JSON.parse(rawClientPorts);
      if (parsed && typeof parsed === "object") state.clientPorts = parsed;
    }
  } catch (e) { /* garde les valeurs par défaut */ }

  try {
    const rawPortCoords = localStorage.getItem(PORT_COORDS_KEY);
    if (rawPortCoords) {
      const parsed = JSON.parse(rawPortCoords);
      if (parsed && typeof parsed === "object") state.portCoordinates = parsed;
    }
  } catch (e) { /* garde les valeurs par défaut */ }
}

function cacheLocally() {
  try {
    localStorage.setItem(SHIPMENTS_KEY, JSON.stringify(state.shipments));
    localStorage.setItem(STEPS_KEY, JSON.stringify(state.steps));
    localStorage.setItem(DOCUMENTS_KEY, JSON.stringify(state.documents));
    localStorage.setItem(LISTS_KEY, JSON.stringify(state.lists));
    localStorage.setItem(CLIENT_DOCS_KEY, JSON.stringify(state.clientDocuments));
    localStorage.setItem(CLIENT_PORTS_KEY, JSON.stringify(state.clientPorts));
    localStorage.setItem(PORT_COORDS_KEY, JSON.stringify(state.portCoordinates));
  } catch (e) { /* stockage plein ou navigation privée : tant pis pour le cache */ }
}

function setSyncStatus(status) {
  const el = document.getElementById("sync-status");
  if (!el) return;
  const map = {
    connecting: { text: "Connexion…", cls: "sync-connecting" },
    synced: { text: "Synchronisé", cls: "sync-synced" },
    offline: { text: "Hors ligne (cache local)", cls: "sync-offline" },
    error: { text: "Erreur de synchronisation", cls: "sync-error" },
  };
  const m = map[status] || map.connecting;
  el.textContent = "● " + m.text;
  el.className = "sync-badge " + m.cls;
}

function pushFullStateToCloud() {
  DOC_REF.set({
    shipments: state.shipments,
    steps: state.steps,
    documents: state.documents,
    lists: state.lists,
    clientDocuments: state.clientDocuments,
    clientPorts: state.clientPorts,
    portCoordinates: state.portCoordinates,
  }).catch((e) => {
    console.error(e);
    if (isPermissionError(e)) { handleWrongCode(); return; }
    setSyncStatus("error");
    alert("Impossible d'initialiser la synchronisation (vérifie la connexion et les règles Firestore).");
  });
}

function subscribeToCloud() {
  DOC_REF.onSnapshot(
    (snap) => {
      if (snap.exists) {
        const data = snap.data();
        if (Array.isArray(data.shipments)) state.shipments = data.shipments;
        if (Array.isArray(data.steps) && data.steps.length) state.steps = data.steps;
        if (Array.isArray(data.documents)) state.documents = data.documents;
        if (data.lists) {
          if (Array.isArray(data.lists.clients)) state.lists.clients = data.lists.clients;
          if (Array.isArray(data.lists.transitaires)) state.lists.transitaires = data.lists.transitaires;
          if (Array.isArray(data.lists.ports)) state.lists.ports = data.lists.ports;
        }
        if (data.clientDocuments && typeof data.clientDocuments === "object") state.clientDocuments = data.clientDocuments;
        if (data.clientPorts && typeof data.clientPorts === "object") state.clientPorts = data.clientPorts;
        if (data.portCoordinates && typeof data.portCoordinates === "object") state.portCoordinates = data.portCoordinates;
        cacheLocally();
        setSyncStatus(snap.metadata.fromCache ? "offline" : "synced");
        render();
      } else {
        // Premier lancement : personne n'a encore écrit dans Firestore, on y
        // pousse l'état local (valeurs par défaut ou cache) pour l'initialiser.
        pushFullStateToCloud();
      }
    },
    (err) => {
      console.error("Firestore sync error", err);
      if (isPermissionError(err)) { handleWrongCode(); return; }
      setSyncStatus("error");
      alert("Synchronisation impossible : vérifie ta connexion internet et les règles Firestore de ce projet.");
    }
  );
}

function normalizeLink(url) {
  const u = (url || "").trim();
  if (!u) return "";
  if (/^https?:\/\//i.test(u)) return u;
  return "https://" + u;
}

// ---------- Logique métier ----------
function stepIndex(s) {
  return state.steps.findIndex((st) => st.label === s.currentStepValue);
}

function overallStatus(s) {
  const idx = stepIndex(s);
  if (idx === -1) return "NOUVEAU";
  if (idx === state.steps.length - 1) return "LIVRÉ";
  return "EN TRANSIT";
}

function stampColor(status) {
  if (status === "LIVRÉ") return { text: "#5A6E42" };
  if (status === "NOUVEAU") return { text: "#8A7F63" };
  return { text: "#2C5F8A" };
}

function progressFraction(s) {
  const total = state.steps.length;
  if (total === 0) return 0;
  const idx = stepIndex(s);
  return (idx + 1) / total;
}

function currentPhaseText(s) {
  const idx = stepIndex(s);
  if (idx === -1) return "En attente de départ";
  return `${idx + 1}. ${state.steps[idx].label}`;
}

function stepTypeColor(type) {
  return type === "transitaire" ? "#8A6A3B" : "#2C5F8A";
}

function normalizeStr(s) {
  return (s || "")
    .toString()
    .trim()
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "");
}

function lookupPortCoords(portName) {
  if (!portName) return null;
  if (state.portCoordinates[portName]) return state.portCoordinates[portName];
  const norm = normalizeStr(portName);
  const found = PORT_DB.find((p) => p.aliases.includes(norm));
  return found ? { lat: found.lat, lng: found.lng } : null;
}

function latLngToXY(lat, lng) {
  return { x: ((lng + 180) / 360) * 1000, y: ((90 - lat) / 180) * 500 };
}

  if (!s.datePositionnement) return { key: "positionnement", label: "En attente de Positionnement" };
  if (!s.dateCloture) return { key: "chargement", label: "En attente de chargement" };
  if (!s.dateETD) return { key: "etd", label: "En attente d'ETD" };
  return { key: "termine", label: "ETD effectué" };
}

function currentMilestone(s) {
  if (s.dateETA) return { label: "ETA", date: s.dateETA };
  if (s.dateETD) return { label: "ETD", date: s.dateETD };
  if (s.dateCloture) return { label: "Clôture", date: s.dateCloture };
  if (s.datePositionnement) return { label: "Positionnement", date: s.datePositionnement };
  return null;
}

function formatDateFr(iso) {
  const parts = (iso || "").split("-");
  if (parts.length !== 3) return iso || "";
  return `${parts[2]}/${parts[1]}`;
}

function dateFieldsHtml(s) {
  const fields = [
    { key: "datePositionnement", label: "Positionnement" },
    { key: "dateCloture", label: "Clôture" },
    { key: "dateETD", label: "ETD" },
    { key: "dateETA", label: "ETA" },
  ];
  return fields
    .map(
      (f) => `
    <div class="date-field">
      <label>${f.label}</label>
      <input type="date" value="${escapeHtml(s[f.key] || "")}" data-action="update-date" data-id="${s.id}" data-field="${f.key}" />
    </div>`
    )
    .join("");
}

// ---------- Rendu ----------
function stepsRowHtml(shipmentId, currentValue) {
  const currentIndex = state.steps.findIndex((st) => st.label === (currentValue || ""));
  let html = '<div class="steps-row">';
  state.steps.forEach((step, i) => {
    const reached = i <= currentIndex;
    const isCurrent = i === currentIndex;
    const color = stepTypeColor(step.type);
    const targetIndex = isCurrent ? i - 1 : i;
    const targetValue = targetIndex >= 0 ? state.steps[targetIndex].label : "";
    html += `<button class="step-dot ${isCurrent ? "current" : ""}" title="${i + 1}. ${escapeHtml(step.label)} (${step.type === "transitaire" ? "Transitaire" : "Client"})"
      style="border-color:${reached ? color : "var(--line)"}; background:${reached ? color : "var(--paper)"};"
      data-action="set-step" data-id="${shipmentId}" data-value="${escapeHtml(targetValue)}"></button>`;
    if (i < state.steps.length - 1) {
      html += `<div class="step-connector" style="background:${i < currentIndex ? color : "var(--line)"};"></div>`;
    }
  });
  html += "</div>";
  return html;
}

function portChipHtml(clientName, port) {
  const active = (state.clientPorts[clientName] || []).includes(port);
  return `<button class="check-chip ${active ? "checked" : ""}" data-action="toggle-client-port" data-client="${escapeHtml(clientName)}" data-port="${escapeHtml(port)}">

function toggleClientPort(clientName, port) {

        <span class="timeline-ref">${escapeHtml(s.ref || s.id.toUpperCase())}</span>

// ---------- Import d'une liste de commandes (fichier ou copier-coller) ----------
const IMPORT_HEADERS = ["référence", "client", "transitaire", "étape", "date positionnement", "date clôture", "etd", "eta"];
const ISO_DATE_RE = /^\d{4}-\d{2}-\d{2}$/;

function splitDelimitedLine(line, delim) {
  const cells = [];
  let cur = "";
  let inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (inQuotes) {
      if (ch === '"') {
        if (line[i + 1] === '"') { cur += '"'; i++; }
        else inQuotes = false;
      } else cur += ch;
    } else {
      if (ch === '"') inQuotes = true;
      else if (ch === delim) { cells.push(cur); cur = ""; }
      else cur += ch;
    }
  }
  cells.push(cur);
  return cells;
}

function detectDelimiter(line) {
  const counts = { "\t": line.split("\t").length, ",": line.split(",").length, ";": line.split(";").length };
  let best = "\t";
  Object.keys(counts).forEach((d) => { if (counts[d] > counts[best]) best = d; });
  return best;
}

function parseDelimitedText(text) {
  const clean = text.replace(/^\uFEFF/, ""); // BOM éventuel en tête de fichier
  const lines = clean.split(/\r?\n/).filter((l) => l.trim().length > 0);
  if (lines.length === 0) return [];
  const delim = detectDelimiter(lines[0]);
  return lines.map((l) => splitDelimitedLine(l, delim));
}

function convertFrDateToISO(raw) {
  if (!raw) return "";
  const datePart = raw.trim().split(" ")[0]; // ignore l'heure éventuelle
  const m = datePart.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (!m) return "";
  const [, d, mo, y] = m;
  return `${y}-${mo.padStart(2, "0")}-${d.padStart(2, "0")}`;
}

function extractPortFromAddress(addr) {
  if (!addr) return "";
  const first = addr.split(" - ")[0] || "";
  return first.trim().replace(/\s+/g, " ");
}

function isSokaSourceHeader(headerRowNorm) {
  return headerRowNorm.includes("doc_numpiece");
}

function mergeSokaSourceRows(rows) {
  const norm = (s) => (s || "").trim().toLowerCase();
  const headerRowNorm = rows[0].map(norm);
  const idx = {
    ref: headerRowNorm.indexOf("doc_numpiece"),
    client: headerRowNorm.indexOf("client_code"),
    date: headerRowNorm.indexOf("doc_datelivraison"),
    address: headerRowNorm.indexOf("doc_adresselivraison"),
  };

  const warnings = [];
  let added = 0, updated = 0;
  let listsChanged = false, portsChanged = false;

  for (let i = 1; i < rows.length; i++) {
    const row = rows[i];
    const ref = (row[idx.ref] || "").trim();
    const client = (row[idx.client] || "").trim();
    if (!ref && !client) continue;

    const datePositionnement = convertFrDateToISO(row[idx.date] || "");
    const port = extractPortFromAddress(row[idx.address] || "");

    if (client && port) {
      if (!state.lists.clients.includes(client)) { state.lists.clients.push(client); listsChanged = true; }
      if (!state.lists.ports.includes(port)) { state.lists.ports.push(port); listsChanged = true; }
      if (!state.clientPorts[client]) state.clientPorts[client] = [];
      if (!state.clientPorts[client].includes(port)) { state.clientPorts[client].push(port); portsChanged = true; }
    }

    const existing = ref ? state.shipments.find((s) => norm(s.ref) === norm(ref)) : null;
    if (existing) {
      existing.client = client || existing.client;
      if (datePositionnement) existing.datePositionnement = datePositionnement;
      updated++;
    } else {
      state.shipments.push({
        id: uid(), ref, client, transitaire: "", currentStepValue: "",
        datePositionnement, dateCloture: "", dateETD: "", dateETA: "",
        comment: "", createdAt: Date.now(),
      });
      added++;
    }
  }

  if (listsChanged) saveLists();
  if (portsChanged) saveClientPorts();
  return { added, updated, warnings };
}

function mergeImportedRows(rows) {
  const norm = (s) => (s || "").trim().toLowerCase();
  let headerMap = null;
  let startIdx = 0;
  if (rows.length && norm(rows[0][0]) === "référence") {
    headerMap = rows[0].map(norm);
    startIdx = 1;
  }
  const getCell = (row, name, fallbackIdx) => {
    if (headerMap) { const idx = headerMap.indexOf(name); return idx >= 0 ? (row[idx] || "") : ""; }
    return row[fallbackIdx] || "";
  };

  const warnings = [];
  let added = 0, updated = 0;

  for (let i = startIdx; i < rows.length; i++) {
    const row = rows[i];
    const ref = getCell(row, "référence", 0).trim();
    const client = getCell(row, "client", 1).trim();
    if (!ref && !client) continue;

    const transitaire = getCell(row, "transitaire", 2).trim();
    const stepText = getCell(row, "étape", 3).trim();
    const dPosRaw = getCell(row, "date positionnement", 4).trim();
    const dCloRaw = getCell(row, "date clôture", 5).trim();
    const dEtdRaw = getCell(row, "etd", 6).trim();
    const dEtaRaw = getCell(row, "eta", 7).trim();

    let currentStepValue = "";
    if (stepText) {
      if (state.steps.some((st) => st.label === stepText)) currentStepValue = stepText;
      else warnings.push(`Ligne ${i + 1} : étape « ${stepText} » inconnue, ignorée.`);
    }

    const checkDate = (raw, label) => {
      if (!raw) return "";
      const trimmed = raw.trim();
      if (ISO_DATE_RE.test(trimmed)) return trimmed;
      const converted = convertFrDateToISO(trimmed);
      if (converted) return converted;
      warnings.push(`Ligne ${i + 1} : date ${label} « ${raw} » ignorée (format attendu AAAA-MM-JJ ou JJ/MM/AAAA).`);
      return "";
    };
    const datePositionnement = checkDate(dPosRaw, "positionnement");
    const dateCloture = checkDate(dCloRaw, "clôture");
    const dateETD = checkDate(dEtdRaw, "ETD");
    const dateETA = checkDate(dEtaRaw, "ETA");

    const existing = ref ? state.shipments.find((s) => norm(s.ref) === norm(ref)) : null;
    if (existing) {
      Object.assign(existing, { client, transitaire, currentStepValue, datePositionnement, dateCloture, dateETD, dateETA });
      updated++;
    } else {
      state.shipments.push({
        id: uid(), ref, client, transitaire, currentStepValue,
        datePositionnement, dateCloture, dateETD, dateETA, comment: "", createdAt: Date.now(),
      });
      added++;
    }
  }
  return { added, updated, warnings };
}

function csvEscape(value) {
  const v = value == null ? "" : String(value);
  if (/[",\n]/.test(v)) return '"' + v.replace(/"/g, '""') + '"';
  return v;
}

function exportCsv() {
  const rows = [
    ["Référence", "Client", "Transitaire", "Étape", "Date positionnement", "Date clôture", "ETD", "ETA"],
  ];
  state.shipments.forEach((s) => {
    rows.push([
      s.ref || "", s.client || "", s.transitaire || "", s.currentStepValue || "",
      s.datePositionnement || "", s.dateCloture || "", s.dateETD || "", s.dateETA || "",
    ]);
  });
  const csv = rows.map((r) => r.map(csvEscape).join(",")).join("\r\n");
  const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const date = new Date().toISOString().slice(0, 10);
  a.href = url;
  a.download = `commandes-soka-${date}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function openImport() {
  document.getElementById("modal-root").innerHTML = `
  <div class="modal-overlay" data-action="overlay-close">
    <div class="modal wide">
      <div class="modal-head"><h2>Importer des commandes</h2><button class="close-btn" data-action="close-modal">${icon("x", 18)}</button></div>
      <div class="modal-note">
        Choisis un fichier .csv, ou colle des lignes copiées depuis Excel.<br>
        Colonnes attendues (dans cet ordre, avec ou sans ligne d'en-tête) : <em>${IMPORT_HEADERS.join(", ")}</em>.<br>
        Dates au format AAAA-MM-JJ. Le port et les documents se règlent ensuite par client, directement sur les fiches.
      </div>
      <div class="field">
        <label>Fichier CSV</label>
        <input type="file" id="import-file-input" accept=".csv,.txt" onchange="handleImportFile(event)" />
      </div>
      <div class="field"><label>...ou coller ici</label><textarea id="import-text" placeholder="Colle ici les lignes copiées depuis Excel…"></textarea></div>
      <div id="import-feedback"></div>
      <button class="modal-submit" style="background:var(--blue); color:var(--paper);" data-action="submit-import">Importer</button>
    </div>
  </div>`;

function handleImportFile(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => { document.getElementById("import-text").value = e.target.result; };
  reader.readAsText(file, "UTF-8");
}

function submitImport() {
  const text = document.getElementById("import-text").value;
  const rows = parseDelimitedText(text);
  const norm = (s) => (s || "").trim().toLowerCase();
  const isSoka = rows.length > 0 && isSokaSourceHeader(rows[0].map(norm));
  const { added, updated, warnings } = isSoka ? mergeSokaSourceRows(rows) : mergeImportedRows(rows);
  const feedback = document.getElementById("import-feedback");
  let html = "";
  if (warnings.length) html += `<div class="warning-box">${warnings.map((w) => `${icon("alertCircle", 13, "margin-right:4px;")}${escapeHtml(w)}`).join("<br>")}</div>`;
  html += `<div class="import-result">${added} commande(s) ajoutée(s), ${updated} mise(s) à jour.</div>`;
  feedback.innerHTML = html;
  if (added || updated) { saveShipments(); render(); }
}

// ---------- Carte des expéditions en cours ----------
function openMap() {
  // Expéditions en cours = pas encore LIVRÉ, avec un client (donc potentiellement un port)
  const active = state.shipments.filter((s) => overallStatus(s) !== "LIVRÉ" && s.client);

  const byPort = {}; // "Nom du port" -> [shipments]
  const unlocated = new Set(); // ports sans coordonnées connues

  active.forEach((s) => {
    const ports = state.clientPorts[s.client] || [];
    ports.forEach((port) => {
      const coords = lookupPortCoords(port);
      if (coords) {
        if (!byPort[port]) byPort[port] = { coords, shipments: [] };
        byPort[port].shipments.push(s);
      } else {
        unlocated.add(port);
      }
    });
  });

  const pins = Object.entries(byPort)
    .map(([port, data]) => {
      const { x, y } = latLngToXY(data.coords.lat, data.coords.lng);
      return `<g class="map-pin" data-action="open-port-popover" data-port="${escapeHtml(port)}" transform="translate(${x},${y})">
        <circle r="7" class="map-pin-dot"></circle>
        <text class="map-pin-count" text-anchor="middle" dy="3.5">${data.shipments.length}</text>
      </g>`;
    })
    .join("");

  const unlocatedHtml = [...unlocated]
    .map(
      (port) => `
    <div class="unlocated-row">
      <span class="unlocated-name">${escapeHtml(port)}</span>
      <input type="number" step="0.01" placeholder="latitude" id="lat-${escapeHtml(port)}" />
      <input type="number" step="0.01" placeholder="longitude" id="lng-${escapeHtml(port)}" />
      <button class="icon-btn" data-action="locate-port" data-port="${escapeHtml(port)}">Localiser</button>
    </div>`
    )
    .join("");

  document.getElementById("modal-root").innerHTML = `
  <div class="modal-overlay" data-action="overlay-close">
    <div class="modal wide" style="max-width:760px;">
      <div class="modal-head"><h2>Carte des expéditions en cours</h2><button class="close-btn" data-action="close-modal">${icon("x", 18)}</button></div>
      ${
        pins === ""
          ? `<div class="modal-note">Aucune expédition en cours n'a de port de destination localisable pour l'instant.</div>`
          : `<svg viewBox="0 0 1000 500" class="map-svg">
              <rect x="0" y="0" width="1000" height="500" class="map-sea"></rect>
              ${[100, 200, 300, 400, 500, 600, 700, 800, 900].map((x) => `<line x1="${x}" y1="0" x2="${x}" y2="500" class="map-grid"/>`).join("")}
              ${[50, 100, 150, 200, 300, 350, 400, 450].map((y) => `<line x1="0" y1="${y}" x2="1000" y2="${y}" class="map-grid"/>`).join("")}
              <line x1="0" y1="250" x2="1000" y2="250" class="map-equator"/>
              <path class="map-continent" d="M60,140 Q40,100 100,70 Q180,50 240,90 Q290,120 270,180 Q250,240 190,260 Q120,270 80,220 Q50,180 60,140 Z"/>
              <path class="map-continent" d="M220,260 Q260,240 300,270 Q330,320 320,380 Q300,440 250,450 Q210,440 200,380 Q195,310 220,260 Z"/>
              <path class="map-continent" d="M470,60 Q540,40 580,70 Q600,100 570,120 Q530,130 490,110 Q460,90 470,60 Z"/>
              <path class="map-continent" d="M480,120 Q560,110 590,160 Q610,240 580,320 Q550,390 500,400 Q460,380 460,300 Q455,200 480,120 Z"/>
              <path class="map-continent" d="M600,60 Q750,40 880,90 Q930,130 900,190 Q850,230 750,220 Q650,210 610,150 Q590,100 600,60 Z"/>
              <path class="map-continent" d="M790,330 Q860,320 900,350 Q910,390 870,410 Q820,420 790,390 Q775,360 790,330 Z"/>
              ${pins}
            </svg>
            <div class="map-legend">${icon("mapPin", 12)} Le chiffre indique le nombre d'expéditions en cours pour ce port. Clique dessus pour les lister.</div>`
      }
      ${
        unlocated.size > 0
          ? `<div class="modal-note" style="margin-top:14px;">Ports non localisés — renseigne leurs coordonnées une fois pour qu'ils apparaissent sur la carte :</div>
             <div class="unlocated-list">${unlocatedHtml}</div>`
          : ""
      }
      <div id="port-popover-root"></div>
    </div>
  </div>`;
}

function openPortPopover(port) {
  const active = state.shipments.filter((s) => overallStatus(s) !== "LIVRÉ" && s.client && (state.clientPorts[s.client] || []).includes(port));
  const root = document.getElementById("port-popover-root");
  if (!root) return;
  root.innerHTML = `
    <div class="port-popover">
      <div class="port-popover-head">
        <span>${escapeHtml(port)}</span>
        <button class="close-btn" data-action="close-port-popover">${icon("x", 15)}</button>
      </div>
      ${active
        .map((s) => {
          const cat = dossierCategory(s);
          return `<button class="port-popover-row" data-action="scroll-to-shipment-close-map" data-id="${s.id}">
            <span class="milestone-badge milestone-${cat.key}" style="margin:0;">${cat.label}</span>
            <span class="port-popover-ref">${escapeHtml(s.ref || s.id.toUpperCase())}</span>
            <span class="port-popover-client">${escapeHtml(s.client)}</span>
          </button>`;
        })
        .join("")}
    </div>`;
}

function locatePort(port) {
  const latInput = document.getElementById(`lat-${port}`);
  const lngInput = document.getElementById(`lng-${port}`);
  const lat = parseFloat(latInput.value);
  const lng = parseFloat(lngInput.value);
  if (Number.isNaN(lat) || Number.isNaN(lng) || lat < -90 || lat > 90 || lng < -180 || lng > 180) {
    alert("Latitude (entre -90 et 90) et longitude (entre -180 et 180) invalides.");
    return;
  }
  state.portCoordinates[port] = { lat, lng };
  savePortCoordinates();
  openMap(); // ré-affiche la carte à jour avec le nouveau point
}

// ---------- Réglages : étapes éditables ----------
function openSettings() {
  draftSteps = {
    steps: state.steps.map((s) => ({ ...s })),
    documents: [...state.documents],
    clients: [...state.lists.clients],
    transitaires: [...state.lists.transitaires],
    ports: [...state.lists.ports],
  };
  renderSettingsModal();
}

function renderSettingsModal() {
  document.getElementById("modal-root").innerHTML = `
  <div class="modal-overlay" data-action="overlay-close">
    <div class="modal wide">
      <div class="modal-head"><h2>Réglages</h2><button class="close-btn" data-action="close-modal">${icon("x", 18)}</button></div>
      <div class="modal-note">Étapes : un seul suivi numéroté, colore chaque étape selon qu'elle appartient au client (bleu) ou au transitaire (brun) — l'ordre détermine la progression du bateau. Documents et Ports : cochés une fois par client, valables sur toutes ses commandes. Clients, Transitaires : listes proposées dans "Nouvel envoi".</div>
      <div class="settings-columns">
        <div class="settings-col" style="flex-basis:100%;">
          <h3>${icon("package", 13, "margin-right:4px;")}Étapes du suivi</h3>
          <div id="settings-steps"></div>
          <button class="add-step-btn" data-action="add-step" data-type="steps">+ Ajouter une étape</button>
        </div>
        <div class="settings-col">
          <h3>${icon("file", 13, "margin-right:4px;")}Documents</h3>
          <div id="settings-documents"></div>
          <button class="add-step-btn" data-action="add-step" data-type="documents">+ Ajouter un document</button>
        </div>
        <div class="settings-col">
          <h3>${icon("mapPin", 13, "margin-right:4px;")}Clients</h3>
          <div id="settings-clients"></div>
          <button class="add-step-btn" data-action="add-step" data-type="clients">+ Ajouter un client</button>
        </div>
        <div class="settings-col">
          <h3>${icon("truck", 13, "margin-right:4px;")}Transitaires</h3>
          <div id="settings-transitaires"></div>
          <button class="add-step-btn" data-action="add-step" data-type="transitaires">+ Ajouter un transitaire</button>
        </div>
        <div class="settings-col">
          <h3>${icon("anchor", 13, "margin-right:4px;")}Ports de destination</h3>
          <div id="settings-ports"></div>
          <button class="add-step-btn" data-action="add-step" data-type="ports">+ Ajouter un port</button>
        </div>
      </div>
      <button class="modal-submit" style="background:var(--blue); color:var(--paper); margin-top:16px;" data-action="save-settings">Enregistrer</button>
    </div>
  </div>`;
  renderStepsEditColumn();
  renderStepEditColumn("documents");
  renderStepEditColumn("clients");
  renderStepEditColumn("transitaires");
  renderStepEditColumn("ports");
}

function renderStepsEditColumn() {
  const container = document.getElementById("settings-steps");
  container.innerHTML = draftSteps.steps.map((step, i) => `
    <div class="step-edit-row">
      <span class="step-num">${i + 1}</span>
      <button class="icon-btn" data-action="move-step" data-type="steps" data-index="${i}" data-dir="-1" ${i === 0 ? "disabled" : ""}>${icon("chevronUp", 12)}</button>
      <button class="icon-btn" data-action="move-step" data-type="steps" data-index="${i}" data-dir="1" ${i === draftSteps.steps.length - 1 ? "disabled" : ""}>${icon("chevronDown", 12)}</button>
      <input value="${escapeHtml(step.label)}" data-action="update-step-text" data-type="steps" data-index="${i}" />
      <button class="doc-btn ${step.type === "client" ? "active-soka" : ""}" data-action="set-step-type" data-index="${i}" data-type="client">Client</button>
      <button class="doc-btn ${step.type === "transitaire" ? "active-transit" : ""}" data-action="set-step-type" data-index="${i}" data-type="transitaire">Transitaire</button>
      <button class="icon-btn" data-action="remove-step" data-type="steps" data-index="${i}">${icon("x", 12)}</button>
    </div>
  `).join("");
}

function setDraftStepType(i, type) {
  if (!draftSteps.steps[i]) return;
  draftSteps.steps[i].type = type;
  renderStepsEditColumn();
}

function renderStepEditColumn(type) {
  const container = document.getElementById(`settings-${type}`);
  container.innerHTML = draftSteps[type].map((step, i) => `
    <div class="step-edit-row">
      <button class="icon-btn" data-action="move-step" data-type="${type}" data-index="${i}" data-dir="-1" ${i === 0 ? "disabled" : ""}>${icon("chevronUp", 12)}</button>
      <button class="icon-btn" data-action="move-step" data-type="${type}" data-index="${i}" data-dir="1" ${i === draftSteps[type].length - 1 ? "disabled" : ""}>${icon("chevronDown", 12)}</button>
      <input value="${escapeHtml(step)}" data-action="update-step-text" data-type="${type}" data-index="${i}" />
      <button class="icon-btn" data-action="remove-step" data-type="${type}" data-index="${i}">${icon("x", 12)}</button>
    </div>
  `).join("");
}

function updateDraftStep(type, i, value) {
  if (type === "steps") draftSteps.steps[i].label = value;
  else draftSteps[type][i] = value;
}
function addDraftStep(type) {
  if (type === "steps") { draftSteps.steps.push({ label: "Nouvelle étape", type: "client" }); renderStepsEditColumn(); return; }
  draftSteps[type].push("Nouvelle étape");
  renderStepEditColumn(type);
}
function removeDraftStep(type, i) {
  const list = type === "steps" ? draftSteps.steps : draftSteps[type];
  if (list.length <= 1) { alert("Il faut garder au moins une étape."); return; }
  list.splice(i, 1);
  if (type === "steps") renderStepsEditColumn();
  else renderStepEditColumn(type);
}
function moveDraftStep(type, i, dir) {
  const list = type === "steps" ? draftSteps.steps : draftSteps[type];
  const j = i + dir;
  if (j < 0 || j >= list.length) return;
  [list[i], list[j]] = [list[j], list[i]];
  if (type === "steps") renderStepsEditColumn();
  else renderStepEditColumn(type);
}

function saveSettings() {
  const cleanSteps = draftSteps.steps.map((s) => ({ label: s.label.trim(), type: s.type })).filter((s) => s.label.length > 0);
  const clean = (arr) => arr.map((s) => s.trim()).filter((s) => s.length > 0);
  const documents = clean(draftSteps.documents || []);
  const clients = clean(draftSteps.clients || []);
  const transitaires = clean(draftSteps.transitaires || []);
  const ports = clean(draftSteps.ports || []);
  if (cleanSteps.length === 0) { alert("Le suivi doit contenir au moins une étape."); return; }
  state.steps = cleanSteps;
  state.documents = documents;
  state.lists.clients = clients;
  state.lists.transitaires = transitaires;
  state.lists.ports = ports;
  saveSteps();
  saveDocuments();
  saveLists();
  closeModal();
  render();
}

// ---------- Délégation d'évènements (clics et saisie) ----------
function handleDelegatedClick(e) {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const action = el.dataset.action;

  switch (action) {
    case "set-filter": setFilter(el.dataset.filter); break;
    case "clear-client-filter": clearClientFilter(); break;
    case "filter-client": filterByClient(el.dataset.client); break;
    case "set-step": setStep(el.dataset.id, el.dataset.value); break;
    case "delete-shipment": deleteShipment(el.dataset.id); break;
    case "toggle-client-doc": toggleClientDocument(el.dataset.client, el.dataset.doc); break;
    case "toggle-client-port": toggleClientPort(el.dataset.client, el.dataset.port); break;
    case "set-step-type": setDraftStepType(Number(el.dataset.index), el.dataset.type); break;
    case "scroll-to-shipment": {
      const target = document.getElementById("shipment-" + el.dataset.id);
      if (target) {
        target.scrollIntoView({ behavior: "smooth", block: "center" });
        target.classList.add("card-highlight");
        setTimeout(() => target.classList.remove("card-highlight"), 1500);
      }
      break;
    }
    case "open-map": openMap(); break;
    case "open-port-popover": openPortPopover(el.dataset.port); break;
    case "close-port-popover": {
      const root = document.getElementById("port-popover-root");
      if (root) root.innerHTML = "";
      break;
    }
    case "locate-port": locatePort(el.dataset.port); break;
    case "submit-access-code": submitAccessCode(); break;
    case "open-import": openImport(); break;
    case "export-csv": exportCsv(); break;
    case "submit-import": submitImport(); break;
    case "scroll-to-shipment-close-map": {
      closeModal();
      setTimeout(() => {
        const target = document.getElementById("shipment-" + el.dataset.id);
        if (target) {
          target.scrollIntoView({ behavior: "smooth", block: "center" });
          target.classList.add("card-highlight");
          setTimeout(() => target.classList.remove("card-highlight"), 1500);
        }
      }, 50);
      break;
    }
    case "open-new": openNew(); break;
    case "submit-new": submitNew(); break;
    case "open-settings": openSettings(); break;
    case "save-settings": saveSettings(); break;
    case "add-step": addDraftStep(el.dataset.type); break;
    case "remove-step": removeDraftStep(el.dataset.type, Number(el.dataset.index)); break;
    case "move-step": moveDraftStep(el.dataset.type, Number(el.dataset.index), Number(el.dataset.dir)); break;
    case "close-modal": closeModal(); break;
    case "overlay-close": if (e.target === el) closeModal(); break;
  }
}

function handleDelegatedInput(e) {
  const el = e.target;
  if (!el.dataset) return;
  if (el.dataset.action === "update-step-text") {
    updateDraftStep(el.dataset.type, Number(el.dataset.index), el.value);
  } else if (el.dataset.action === "update-comment") {
    updateComment(el.dataset.id, el.value);
  }
}

function handleDelegatedChange(e) {
  const el = e.target;
  if (!el.dataset) return;
  if (el.dataset.action === "toggle-new-field") {
    const target = document.getElementById(el.dataset.target);
    if (target) target.style.display = el.value === "__new__" ? "block" : "none";
  } else if (el.dataset.action === "update-date") {
    updateDate(el.dataset.id, el.dataset.field, el.value);
  }
}

document.addEventListener("click", handleDelegatedClick);
document.addEventListener("input", handleDelegatedInput);
document.addEventListener("change", handleDelegatedChange);

// ---------- Initialisation ----------
const cachedCode = localStorage.getItem(ACCESS_CODE_KEY);
if (cachedCode) {
  initWithCode(cachedCode);
} else {
  showAccessGate();
}

</script>
</body>
</html>
